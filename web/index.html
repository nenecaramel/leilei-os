<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Leilei OS personal operations dashboard"
    />
    <script>
      (() => {
        const cacheKey = "leilei-os.theme.v1";
        const version = 1;
        const accentPattern = /^#[0-9A-Fa-f]{6}$/;
        const allowedPrefix = /^(--theme|--green|--line|--cream|--focus|--shadow)/;

        try {
          const raw = window.localStorage.getItem(cacheKey);
          if (!raw) return;
          const cached = JSON.parse(raw);
          if (
            cached?.version !== version ||
            !accentPattern.test(cached?.accentColor ?? "") ||
            !cached?.variables ||
            typeof cached.variables !== "object" ||
            Array.isArray(cached.variables) ||
            typeof cached.variables["--theme"] !== "string"
          ) return;

          Object.entries(cached.variables).forEach(([name, value]) => {
            if (allowedPrefix.test(name) && typeof value === "string") {
              document.documentElement.style.setProperty(name, value);
            }
          });
        } catch {
          // Theme cache is optional and must never block initial rendering.
        }
      })();
    </script>
    <title>Leilei OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
