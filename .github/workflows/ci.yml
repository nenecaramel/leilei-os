name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "ios/**"
      - "docs/**"
      - "*.md"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "ios/**"
      - "docs/**"
      - "*.md"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.scope.outputs.postgres }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify exact event head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact event head: $actual"

      - name: Determine changed areas
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          core=false
          web=false
          wake=false
          postgres=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            core=true
            web=true
            wake=true
            postgres=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              core=true
              web=true
              wake=true
              postgres=true
            else
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$base"
              fi

              changed="$(git diff --name-only "$base" "$head")"
              printf '%s\n' "$changed"

              while IFS= read -r file; do
                [[ -z "$file" ]] && continue

                if [[ "$file" == ".github/workflows/ci.yml" ]]; then
                  core=true
                  web=true
                  wake=true
                  postgres=true
                  continue
                fi

                case "$file" in
                  web/*)
                    web=true
                    ;;
                  cmd/native-live-wake-broker/*|Dockerfile.wake-broker)
                    wake=true
                    ;;
                  ios/*|docs/*|*.md)
                    ;;
                  *)
                    core=true
                    ;;
                esac

                case "$file" in
                  src/*|tests/*|drizzle/*|drizzle.config.ts|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json|scripts/*)
                    postgres=true
                    ;;
                esac
              done <<< "$changed"
            fi
          fi

          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "wake=$wake" >> "$GITHUB_OUTPUT"
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.core == 'true'
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.core == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install root dependencies
        if: steps.scope.outputs.core == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Claude Bridge test dependencies
        if: steps.scope.outputs.core == 'true'
        run: pnpm --dir tools/claude-bridge install --frozen-lockfile

      - name: Install Web test dependencies for canonical suite
        if: steps.scope.outputs.core == 'true'
        run: cd web && npm ci

      - name: Run deterministic canonical suite
        if: steps.scope.outputs.core == 'true'
        run: pnpm test

      - name: Run Claude Bridge suite
        if: steps.scope.outputs.core == 'true'
        run: pnpm --dir tools/claude-bridge test

      - name: Typecheck root
        if: steps.scope.outputs.core == 'true'
        run: pnpm typecheck

      - name: Verify generated artifacts
        if: steps.scope.outputs.core == 'true'
        run: pnpm check:generated

      - name: Build root
        if: steps.scope.outputs.core == 'true'
        run: pnpm build

      - name: Check whitespace
        if: steps.scope.outputs.core == 'true'
        run: git diff --check

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.web == 'true' && steps.scope.outputs.core != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        if: steps.scope.outputs.web == 'true' && steps.scope.outputs.core != 'true'
        run: cd web && npm ci

      - name: Typecheck Web
        if: steps.scope.outputs.web == 'true'
        run: cd web && npm run typecheck

      - name: Build Web
        if: steps.scope.outputs.web == 'true'
        run: cd web && npm run build

      - uses: actions/setup-go@v7
        if: steps.scope.outputs.wake == 'true'
        with:
          go-version: "1.25.x"
          # The broker has no module dependencies (no go.sum), so there is
          # nothing to cache; pointing the cache at go.sum only failed restore.
          cache: false

      - name: Build tiny wake broker
        if: steps.scope.outputs.wake == 'true'
        run: cd cmd/native-live-wake-broker && go test ./...

  postgres-regressions:
    needs: checks
    if: needs.checks.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leileios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leileios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/leileios_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact event head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact event head: $actual"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install root dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Install Claude Bridge regression dependencies
        run: pnpm --dir tools/claude-bridge install --frozen-lockfile

      - name: Apply ephemeral PostgreSQL migrations
        id: migrate
        run: pnpm db:migrate

      - name: Verify migration ledger
        id: ledger
        run: pnpm db:check

      - name: Run active-user PostgreSQL regressions
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && steps.ledger.outcome == 'success' }}
        env:
          RUN_ACTIVE_USER_DATABASE_INTEGRATION_TEST: "1"
          RUN_DATABASE_INTEGRATION_TEST: "1"
          RUN_UNIVERSE_MCP_WRITE_DATABASE_TEST: "1"
          RUN_UNIVERSE_MCP_PROVENANCE_DATABASE_TEST: "1"
          RUN_MCP_WRITE_IDEMPOTENCY_DATABASE_TEST: "1"
        run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/diary-repository.integration.test.ts
          tests/diary-discovery-repository.integration.test.ts
          tests/universe-compact-read.integration.test.ts
          tests/active-user-mutation-atomicity.integration.test.ts
          tests/universe-mcp-writes.integration.test.ts
          tests/mcp-universe-write-migration.integration.test.ts
          tests/mcp-write-idempotency.integration.test.ts
          tests/universe-mcp-provenance.integration.test.ts

      - name: Run isolated Native Live / Runtime PostgreSQL regressions
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && steps.ledger.outcome == 'success' }}
        env:
          RUN_ISOLATED_POSTGRES_REGRESSIONS: "1"
          ISOLATED_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm test:isolated-postgres-regressions

      - name: Run retention PostgreSQL regression
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && steps.ledger.outcome == 'success' }}
        env:
          RUN_DATA_RETENTION_DATABASE_TEST: "1"
        run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/data-retention.integration.test.ts
