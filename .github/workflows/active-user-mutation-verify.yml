name: Active user mutation verification

on:
  pull_request:
    branches:
      - main
    paths:
      - src/app/create-app.ts
      - src/database/client.ts
      - src/database/migrate.ts
      - src/database/migration-readiness.ts
      - src/domains/require-active-user-transaction.ts
      - src/domains/memory/memory-repository.ts
      - src/domains/diary/diary-repository.ts
      - src/domains/task/task-repository.ts
      - src/domains/todo/todo-repository.ts
      - src/domains/universe/universe-repository-drizzle.ts
      - src/domains/universe/universe-repository.ts
      - src/domains/universe/universe-service.ts
      - src/domains/mcp-write/mcp-write-idempotency.ts
      - src/database/schema.ts
      - drizzle/0025_wild_xavin.sql
      - tests/active-user-mutation-atomicity.test.ts
      - tests/active-user-mutation-atomicity.integration.test.ts
      - tests/database-readiness-wiring.test.ts
      - tests/migration-readiness.test.ts
      - tests/universe-mcp-writes.integration.test.ts
      - tests/mcp-universe-write-migration.integration.test.ts
      - tests/mcp-write-idempotency.integration.test.ts
      - tests/universe-mcp-provenance.integration.test.ts
      - .github/workflows/active-user-mutation-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      RUN_ACTIVE_USER_DATABASE_INTEGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact PR head: $actual"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: cd web && npm ci
      - name: Apply ephemeral PostgreSQL migrations
        run: pnpm db:migrate
      - name: Run lifecycle PostgreSQL integration tests
        env:
          RUN_DATABASE_INTEGRATION_TEST: "1"
          RUN_TASK_STATUS_REOPEN_DATABASE_TEST: "1"
        run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/memory-lifecycle-repository.integration.test.ts
          tests/diary-repository.integration.test.ts
          tests/task-lifecycle-repository.integration.test.ts
          tests/task-status-reopen.integration.test.ts
      - name: Run active-user source contract
        run: pnpm exec tsx --test tests/active-user-mutation-atomicity.test.ts
      - name: Run PostgreSQL concurrency regression
        run: pnpm exec tsx --test --test-reporter=spec tests/active-user-mutation-atomicity.integration.test.ts
      - name: Run Universe MCP PostgreSQL integration
        env:
          RUN_UNIVERSE_MCP_WRITE_DATABASE_TEST: "1"
          RUN_UNIVERSE_MCP_PROVENANCE_DATABASE_TEST: "1"
          RUN_MCP_WRITE_IDEMPOTENCY_DATABASE_TEST: "1"
        run: >-
          pnpm exec tsx --test --test-concurrency=1 --test-reporter=spec
          tests/universe-mcp-writes.integration.test.ts
          tests/mcp-universe-write-migration.integration.test.ts
          tests/mcp-write-idempotency.integration.test.ts
          tests/universe-mcp-provenance.integration.test.ts
      - name: Run deterministic canonical test suite
        run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: cd web && npm run typecheck && npm run build
      - run: git diff --check
