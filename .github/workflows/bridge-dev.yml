name: Bridge feature verification

on:
  push:
    branches:
      - feat/mcp-app-message-bridge
    paths:
      - src/**
      - drizzle/**
      - tests/**
      - web/**
      - scripts/build-bridge-browser.mjs
      - scripts/generate-web-icons.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/bridge-dev.yml
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - drizzle/**
      - tests/**
      - web/**
      - scripts/build-bridge-browser.mjs
      - scripts/generate-web-icons.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/bridge-dev.yml

jobs:
  root-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leileios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leileios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/leileios_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact event head: $actual"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd web && npm ci
      - name: Web typecheck and build
        run: cd web && npm run typecheck && npm run build
      - run: pnpm exec tsx --test tests/bridge-ext-apps-compatibility.test.ts
      - run: pnpm db:migrate
      - run: pnpm db:check
      - name: Bridge database integration when present
        shell: bash
        run: |
          if [ -f tests/bridge-repository.integration.test.ts ]; then
            RUN_BRIDGE_DATABASE_TEST=1 pnpm exec tsx --test --test-concurrency=1 tests/bridge-repository.integration.test.ts
          fi
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check:generated
      - run: pnpm build
