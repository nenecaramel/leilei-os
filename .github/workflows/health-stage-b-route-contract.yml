name: Health Stage B live route contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/health-stage-b-route-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production Health route contract
        shell: bash
        run: |
          set -euo pipefail

          ROOT_BODY="${RUNNER_TEMP}/health-root.json"
          ROOT_STATUS="$(curl --silent --show-error --max-time 15 \
            -o "${ROOT_BODY}" -w '%{http_code}' \
            https://leilei-os-production.up.railway.app/health)"
          [[ "${ROOT_STATUS}" == "200" ]] || {
            echo "Production /health returned HTTP ${ROOT_STATUS}, expected 200." >&2
            exit 1
          }
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "${ROOT_BODY}" || {
            echo "Production /health body does not report status=ok." >&2
            exit 1
          }

          RETIRED_STATUS="$(curl --silent --show-error --max-time 15 \
            -o "${RUNNER_TEMP}/retired-health-response" -w '%{http_code}' \
            https://leilei-os-production.up.railway.app/api/v1/health)"

          case "${RETIRED_STATUS}" in
            401|403|404)
              ;;
            *)
              echo "Retired /api/v1/health returned unexpected HTTP ${RETIRED_STATUS}; expected auth rejection or route absence." >&2
              exit 1
              ;;
          esac

          printf 'production_infrastructure_health=pass\nretired_product_health_anonymous_status=%s\n' "${RETIRED_STATUS}"
