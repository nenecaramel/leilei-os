name: One-shot paper metadata popover fix

on:
  push:
    branches:
      - fix/paper-metadata-popover-clipping-20260823

permissions:
  contents: write

jobs:
  red-green-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify regression test is RED before the fix
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/paper-author-editor-layout-regression.test.ts; then
            echo "Regression test unexpectedly passed before the fix."
            exit 1
          fi
      - name: Apply only the scoped overflow fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("web/src/styles.css")
          text = path.read_text()
          needle = '''.paper-detail-bottom-left > * {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          '''
          addition = '''
          .paper-detail-paper[id^="memory-"] .paper-detail-bottom-left > .memory-paper-metadata,
          .paper-detail-paper[id^="task-"] .paper-detail-bottom-left > .memory-paper-metadata {
            overflow: visible;
          }
          '''
          if addition.strip() in text:
              raise SystemExit("Scoped overflow rule already exists")
          if text.count(needle) != 1:
              raise SystemExit(f"Expected exactly one shared bottom-left child rule, found {text.count(needle)}")
          path.write_text(text.replace(needle, needle + addition, 1))
          PY
      - name: Verify regression test is GREEN after the fix
        run: node --test tests/paper-author-editor-layout-regression.test.ts
      - name: Verify Web typecheck and build
        shell: bash
        run: |
          npm --prefix web install
          npm --prefix web run typecheck
          npm --prefix web run build
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/paper-metadata-popover-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/styles.css .github/workflows/paper-metadata-popover-fix-once.yml
          git commit -m "fix: allow Memory and Task metadata menus to overflow"
          git push origin HEAD:${GITHUB_REF_NAME}
