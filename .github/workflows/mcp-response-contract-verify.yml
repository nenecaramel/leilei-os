name: MCP response contract verification

on:
  pull_request:
    branches:
      - main
    paths:
      - src/mcp/tools/**/register.ts
      - tests/mcp-response-contract.test.ts
      - .github/workflows/mcp-response-contract-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact PR head: $actual"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Web dependencies required by canonical root tests
        run: cd web && npm ci
      - name: Run focused MCP response contract regression
        run: pnpm exec tsx --test tests/mcp-response-contract.test.ts
      - name: Run deterministic canonical test suite
        run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: git diff --check
