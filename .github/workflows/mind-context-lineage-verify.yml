name: Mind Context Lineage Verify

on:
  pull_request:
    paths:
      - "tests/native-live-mind-followup.integration.test.ts"
      - "src/domains/bridge/native-live-manual-compact.ts"
      - ".github/workflows/mind-context-lineage-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leileios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leileios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/leileios_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - name: Compact lineage integration regression
        env:
          RUN_NATIVE_LIVE_MIND_FOLLOWUP_DATABASE_TEST: "1"
        run: pnpm exec tsx --test --test-concurrency=1 tests/native-live-mind-followup.integration.test.ts
      - run: git diff --check
