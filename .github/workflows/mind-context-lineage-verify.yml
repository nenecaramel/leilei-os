name: Mind Context Lineage Verify

on:
  pull_request:
    paths:
      - "src/domains/runtime/**"
      - "src/domains/bridge/**"
      - "src/database/schema.ts"
      - "drizzle/**"
      - "tests/**"
      - "tools/claude-bridge/**"
      - ".github/workflows/mind-context-lineage-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leileios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leileios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/leileios_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact PR head: $actual"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused Mind unit regressions
        run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/runtime-mind-loop-foundation.test.ts
          tests/native-live-backend-mind-runtime.test.ts
          tests/runtime-mind-semantic-actions.test.ts
          tests/runtime-thought-mind-binding.test.ts
          tests/native-live-mind-followup.test.ts
      - name: Claude bridge system prompt regressions
        run: node --test tools/claude-bridge/test/agent-sdk-claude-transport.test.mjs
      - name: Native Live turn database regression
        env:
          RUN_NATIVE_LIVE_TURN_DATABASE_TEST: "1"
        run: pnpm exec tsx --test --test-concurrency=1 tests/native-live-backend-turn-repository.integration.test.ts
      - name: Native Live Mind follow-up database regression
        env:
          RUN_NATIVE_LIVE_MIND_FOLLOWUP_DATABASE_TEST: "1"
        run: pnpm exec tsx --test --test-concurrency=1 tests/native-live-mind-followup.integration.test.ts
      - name: Runtime Mind database regression
        env:
          RUN_RUNTIME_MIND_DATABASE_TEST: "1"
        run: pnpm exec tsx --test --test-concurrency=1 tests/runtime-subject-state-repository.integration.test.ts
      - name: Build
        run: pnpm build
      - name: Diff check
        run: git diff --check
