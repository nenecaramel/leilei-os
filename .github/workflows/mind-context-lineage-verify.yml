name: Mind Context Lineage Verify

on:
  pull_request:
    paths:
      - "src/domains/runtime/context-invocation-contract.ts"
      - "src/domains/runtime/context-lineage.ts"
      - "tests/runtime-mind-loop-foundation.test.ts"
      - ".github/workflows/mind-context-lineage-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Context lineage unit regression
        run: pnpm exec tsx --test --test-concurrency=1 tests/runtime-mind-loop-foundation.test.ts
      - run: git diff --check
