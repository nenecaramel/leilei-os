name: Mind Context Lineage Verify

on:
  pull_request:
    paths:
      - "tools/claude-bridge/**"
      - ".github/workflows/mind-context-lineage-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Claude bridge system prompt regression
        run: node --test tools/claude-bridge/test/agent-sdk-claude-transport.test.mjs
      - run: git diff --check
