name: Health Stage B destructive migration gate

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture current main and exact PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          PR_JSON="$(gh api repos/${GITHUB_REPOSITORY}/pulls/174)"
          PR_HEAD_SHA="$(jq -r '.head.sha' <<<"${PR_JSON}")"
          PR_BASE="$(jq -r '.base.ref' <<<"${PR_JSON}")"
          PR_STATE="$(jq -r '.state' <<<"${PR_JSON}")"
          PR_DRAFT="$(jq -r '.draft' <<<"${PR_JSON}")"

          [[ "${PR_BASE}" == "main" ]] || { echo "PR #174 is not based on main" >&2; exit 1; }
          [[ "${PR_STATE}" == "open" ]] || { echo "PR #174 is not open" >&2; exit 1; }
          [[ "${PR_DRAFT}" == "true" ]] || { echo "PR #174 must remain Draft during rehearsal" >&2; exit 1; }

          gh api --paginate repos/${GITHUB_REPOSITORY}/pulls/174/files --jq '.[].filename' | LC_ALL=C sort > "${RUNNER_TEMP}/actual-files.txt"
          cat > "${RUNNER_TEMP}/expected-files.txt" <<'EOF'
          drizzle/0024_brainy_wildside.sql
          drizzle/meta/0024_snapshot.json
          drizzle/meta/_journal.json
          src/database/schema.ts
          tests/health-stage-b-drop-table.test.ts
          EOF
          LC_ALL=C sort -o "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/expected-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt"

          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          printf 'main_sha=%s\npr_head_sha=%s\n' "${MAIN_SHA}" "${PR_HEAD_SHA}" > "${RUNNER_TEMP}/health-stage-b-gate-report.txt"

      - name: Require gate secrets without exposing them
        env:
          PROD_DATABASE_URL: ${{ secrets.HEALTH_STAGE_B_PRODUCTION_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.HEALTH_STAGE_B_BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROD_DATABASE_URL}" ]] || { echo "Missing HEALTH_STAGE_B_PRODUCTION_DATABASE_URL" >&2; exit 1; }
          [[ -n "${BACKUP_PASSPHRASE}" ]] || { echo "Missing HEALTH_STAGE_B_BACKUP_PASSPHRASE" >&2; exit 1; }
          [[ "${#BACKUP_PASSPHRASE}" -ge 16 ]] || { echo "Backup passphrase must contain at least 16 characters" >&2; exit 1; }

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Production pre-change readback and fresh encrypted backup
        id: backup
        env:
          DATABASE_URL: ${{ secrets.HEALTH_STAGE_B_PRODUCTION_DATABASE_URL }}
          LEILEI_BACKUP_PASSPHRASE: ${{ secrets.HEALTH_STAGE_B_BACKUP_PASSPHRASE }}
          LEILEI_BACKUP_DIR: ${{ runner.temp }}/leilei-health-stage-b-backups
          PG_DUMP_BIN: /usr/lib/postgresql/18/bin/pg_dump
          PSQL_BIN: /usr/lib/postgresql/18/bin/psql
          PGCONNECT_TIMEOUT: "15"
        shell: bash
        run: |
          set -euo pipefail
          PSQL="${PSQL_BIN}"

          HEALTH_EXISTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL}" -XAt -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.health_records') IS NOT NULL;" 2>"${RUNNER_TEMP}/prod-readback.err")" 
          [[ "${HEALTH_EXISTS}" == "t" ]] || { echo "health_records is not present in production before migration" >&2; exit 1; }

          HEALTH_COUNT="$(PGDATABASE="${DATABASE_URL}" "${PSQL}" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.health_records;" 2>>"${RUNNER_TEMP}/prod-readback.err")"
          LEDGER_COUNT="$(PGDATABASE="${DATABASE_URL}" "${PSQL}" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.leilei_schema_migrations;" 2>>"${RUNNER_TEMP}/prod-readback.err")"
          LEDGER_LATEST="$(PGDATABASE="${DATABASE_URL}" "${PSQL}" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT created_at::text, hash FROM public.leilei_schema_migrations ORDER BY created_at DESC LIMIT 1;" 2>>"${RUNNER_TEMP}/prod-readback.err")"
          DURABLE_COUNTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL}" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM core_memories),(SELECT count(*) FROM diary_entries),(SELECT count(*) FROM tasks),(SELECT count(*) FROM user_settings);" 2>>"${RUNNER_TEMP}/prod-readback.err")"
          FK_DEPENDENTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL}" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_constraint WHERE contype='f' AND confrelid='public.health_records'::regclass;" 2>>"${RUNNER_TEMP}/prod-readback.err")"
          VIEW_DEPENDENTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL}" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(DISTINCT v.oid) FROM pg_depend d JOIN pg_rewrite r ON d.objid=r.oid JOIN pg_class v ON r.ev_class=v.oid WHERE d.refobjid='public.health_records'::regclass AND v.relkind IN ('v','m');" 2>>"${RUNNER_TEMP}/prod-readback.err")"

          [[ "${FK_DEPENDENTS}" == "0" ]] || { echo "Unexpected foreign-key dependency references health_records" >&2; exit 1; }
          [[ "${VIEW_DEPENDENTS}" == "0" ]] || { echo "Unexpected view dependency references health_records" >&2; exit 1; }

          ./scripts/db/backup_postgres.sh
          BACKUP_FILE="$(find "${LEILEI_BACKUP_DIR}" -maxdepth 1 -type f -name '*.backup.enc' | head -n 1)"
          [[ -n "${BACKUP_FILE}" && -f "${BACKUP_FILE}.sha256" ]] || { echo "Encrypted backup output missing" >&2; exit 1; }
          (cd "${LEILEI_BACKUP_DIR}" && shasum -a 256 -c "$(basename "${BACKUP_FILE}.sha256")")

          printf 'production_health_records_exists=true\nproduction_health_records_count=%s\nproduction_ledger_count=%s\nproduction_ledger_latest=%s\nproduction_durable_counts=%s\nproduction_fk_dependents=%s\nproduction_view_dependents=%s\n' \
            "${HEALTH_COUNT}" "${LEDGER_COUNT}" "${LEDGER_LATEST}" "${DURABLE_COUNTS}" "${FK_DEPENDENTS}" "${VIEW_DEPENDENTS}" \
            >> "${RUNNER_TEMP}/health-stage-b-gate-report.txt"

          echo "backup_file=${BACKUP_FILE}" >> "$GITHUB_OUTPUT"
          echo "health_count=${HEALTH_COUNT}" >> "$GITHUB_OUTPUT"
          echo "ledger_count=${LEDGER_COUNT}" >> "$GITHUB_OUTPUT"
          echo "ledger_latest=${LEDGER_LATEST}" >> "$GITHUB_OUTPUT"
          echo "durable_counts=${DURABLE_COUNTS}" >> "$GITHUB_OUTPUT"

      - name: Preserve fresh encrypted production backup
        uses: actions/upload-artifact@v4
        with:
          name: health-stage-b-fresh-production-backup-${{ steps.pr.outputs.head_sha }}
          path: |
            ${{ steps.backup.outputs.backup_file }}
            ${{ steps.backup.outputs.backup_file }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start disposable PostgreSQL 18 with TLS
        id: tempdb
        shell: bash
        run: |
          set -euo pipefail
          CERT_DIR="${RUNNER_TEMP}/health-stage-b-pg18-certs"
          mkdir -p "${CERT_DIR}"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' \
            -keyout "${CERT_DIR}/server.key" -out "${CERT_DIR}/server.crt" >/dev/null 2>&1
          PG_GID="$(docker run --rm postgres:18 id -g postgres)"
          sudo chown root:"${PG_GID}" "${CERT_DIR}/server.key"
          sudo chmod 0640 "${CERT_DIR}/server.key"
          chmod 0644 "${CERT_DIR}/server.crt"

          docker run -d --name leilei-health-stage-b-pg18 \
            -e POSTGRES_PASSWORD=postgres \
            -p 127.0.0.1:55432:5432 \
            -v "${CERT_DIR}:/certs:ro" \
            postgres:18 \
            -c ssl=on \
            -c ssl_cert_file=/certs/server.crt \
            -c ssl_key_file=/certs/server.key

          for _ in $(seq 1 30); do
            if PGPASSWORD=postgres /usr/lib/postgresql/18/bin/pg_isready -h 127.0.0.1 -p 55432 -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          PGPASSWORD=postgres /usr/lib/postgresql/18/bin/psql \
            'postgresql://postgres:postgres@127.0.0.1:55432/postgres?sslmode=require' \
            -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE leilei_restore_verify;' >/dev/null

          TEMP_DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:55432/leilei_restore_verify?sslmode=require'
          echo "database_url=${TEMP_DATABASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Restore fresh backup into disposable PostgreSQL 18
        env:
          LEILEI_ALLOW_TEMP_RESTORE: "1"
          LEILEI_RESTORE_TARGET_ENV: temporary
          TEMP_DATABASE_URL: ${{ steps.tempdb.outputs.database_url }}
          BACKUP_FILE: ${{ steps.backup.outputs.backup_file }}
          LEILEI_BACKUP_PASSPHRASE: ${{ secrets.HEALTH_STAGE_B_BACKUP_PASSPHRASE }}
          PG_RESTORE_BIN: /usr/lib/postgresql/18/bin/pg_restore
          PSQL_BIN: /usr/lib/postgresql/18/bin/psql
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/db/restore_verify_postgres.sh

          RESTORED_HEALTH_COUNT="$(PGDATABASE="${TEMP_DATABASE_URL}" "${PSQL_BIN}" -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.health_records;')"
          RESTORED_LEDGER_COUNT="$(PGDATABASE="${TEMP_DATABASE_URL}" "${PSQL_BIN}" -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.leilei_schema_migrations;')"
          RESTORED_LEDGER_LATEST="$(PGDATABASE="${TEMP_DATABASE_URL}" "${PSQL_BIN}" -XAt -F '|' -v ON_ERROR_STOP=1 -c 'SELECT created_at::text, hash FROM public.leilei_schema_migrations ORDER BY created_at DESC LIMIT 1;')"
          RESTORED_DURABLE_COUNTS="$(PGDATABASE="${TEMP_DATABASE_URL}" "${PSQL_BIN}" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM core_memories),(SELECT count(*) FROM diary_entries),(SELECT count(*) FROM tasks),(SELECT count(*) FROM user_settings);")"

          [[ "${RESTORED_HEALTH_COUNT}" == '${{ steps.backup.outputs.health_count }}' ]] || { echo "Restored health_records count does not match production" >&2; exit 1; }
          [[ "${RESTORED_LEDGER_COUNT}" == '${{ steps.backup.outputs.ledger_count }}' ]] || { echo "Restored ledger count does not match production" >&2; exit 1; }
          [[ "${RESTORED_LEDGER_LATEST}" == '${{ steps.backup.outputs.ledger_latest }}' ]] || { echo "Restored ledger head does not match production" >&2; exit 1; }
          [[ "${RESTORED_DURABLE_COUNTS}" == '${{ steps.backup.outputs.durable_counts }}' ]] || { echo "Restored durable counts do not match production" >&2; exit 1; }

          printf 'disposable_restore=pass\nrestored_health_records_count=%s\nrestored_ledger_count=%s\nrestored_ledger_latest=%s\nrestored_durable_counts=%s\n' \
            "${RESTORED_HEALTH_COUNT}" "${RESTORED_LEDGER_COUNT}" "${RESTORED_LEDGER_LATEST}" "${RESTORED_DURABLE_COUNTS}" \
            >> "${RUNNER_TEMP}/health-stage-b-gate-report.txt"

      - name: Checkout exact Health Stage B PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install exact-head dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec tsx --import ./tests/register-css-loader.mjs --test tests/health-stage-b-drop-table.test.ts

      - name: Run exact migration runner only against disposable restore
        env:
          DATABASE_URL: ${{ steps.tempdb.outputs.database_url }}
          PSQL_BIN: /usr/lib/postgresql/18/bin/psql
        shell: bash
        run: |
          set -euo pipefail

          PRE_HEALTH_EXISTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.health_records') IS NOT NULL;")"
          PRE_LEDGER_COUNT="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.leilei_schema_migrations;')"
          PRE_COUNTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM core_memories),(SELECT count(*) FROM diary_entries),(SELECT count(*) FROM tasks),(SELECT count(*) FROM user_settings);")"
          [[ "${PRE_HEALTH_EXISTS}" == "t" ]] || { echo "health_records missing before disposable migration" >&2; exit 1; }

          node dist/database/migrate.js

          POST_HEALTH_EXISTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.health_records') IS NOT NULL;")"
          POST_LEDGER_COUNT="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.leilei_schema_migrations;')"
          POST_LEDGER_LATEST="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -F '|' -v ON_ERROR_STOP=1 -c 'SELECT created_at::text, hash FROM public.leilei_schema_migrations ORDER BY created_at DESC LIMIT 1;')"
          POST_COUNTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM core_memories),(SELECT count(*) FROM diary_entries),(SELECT count(*) FROM tasks),(SELECT count(*) FROM user_settings);")"

          [[ "${POST_HEALTH_EXISTS}" == "f" ]] || { echo "health_records still exists after disposable migration" >&2; exit 1; }
          [[ "${POST_COUNTS}" == "${PRE_COUNTS}" ]] || { echo "Unrelated durable counts changed during migration" >&2; exit 1; }
          [[ "$((PRE_LEDGER_COUNT + 1))" == "${POST_LEDGER_COUNT}" ]] || { echo "Migration ledger did not advance by exactly one row" >&2; exit 1; }

          node dist/database/migrate.js

          SECOND_LEDGER_COUNT="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.leilei_schema_migrations;')"
          SECOND_COUNTS="$(PGDATABASE="${DATABASE_URL}" "${PSQL_BIN}" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM core_memories),(SELECT count(*) FROM diary_entries),(SELECT count(*) FROM tasks),(SELECT count(*) FROM user_settings);")"
          [[ "${SECOND_LEDGER_COUNT}" == "${POST_LEDGER_COUNT}" ]] || { echo "Second migration runner invocation was not a ledger no-op" >&2; exit 1; }
          [[ "${SECOND_COUNTS}" == "${POST_COUNTS}" ]] || { echo "Second migration runner invocation changed durable counts" >&2; exit 1; }

          printf 'exact_pr_head=%s\nexact_migration_runner=pass\nhealth_records_absent_after=true\npost_migration_ledger_count=%s\npost_migration_ledger_latest=%s\nunrelated_durable_counts_unchanged=true\nsecond_migration_runner_noop=true\n' \
            '${{ steps.pr.outputs.head_sha }}' "${POST_LEDGER_COUNT}" "${POST_LEDGER_LATEST}" \
            >> "${RUNNER_TEMP}/health-stage-b-gate-report.txt"

      - name: Verify current infrastructure Health route contracts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            https://leilei-os-production.up.railway.app/health >/dev/null
          RETIRED_STATUS="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' \
            https://leilei-os-production.up.railway.app/api/v1/health)"
          [[ "${RETIRED_STATUS}" == "404" ]] || { echo "Retired product /api/v1/health route is unexpectedly present" >&2; exit 1; }
          printf 'production_infrastructure_health=pass\nretired_product_health_status=%s\n' "${RETIRED_STATUS}" \
            >> "${RUNNER_TEMP}/health-stage-b-gate-report.txt"

      - name: Preserve non-secret gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: health-stage-b-gate-evidence-${{ steps.pr.outputs.head_sha }}
          path: ${{ runner.temp }}/health-stage-b-gate-report.txt
          if-no-files-found: error
          retention-days: 90

      - name: Stop disposable PostgreSQL
        if: always()
        shell: bash
        run: docker rm -f leilei-health-stage-b-pg18 >/dev/null 2>&1 || true
