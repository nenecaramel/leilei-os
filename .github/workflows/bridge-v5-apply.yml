name: Temporary Bridge v5 apply

on:
  push:
    branches:
      - fix/message-bridge-resource-v5

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/message-bridge-resource-v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply minimal Bridge renderer fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/mcp/tools/bridge-listener/listener-resource.ts')
          s = p.read_text()
          old = 'ui://leileios/message-bridge/v4'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'ui://leileios/message-bridge/v5'))

          p = Path('src/mcp/tools/bridge-listener/browser-runtime.ts')
          s = p.read_text()
          pattern = re.compile(
              r'^[ \t]*const capabilities = app\.getHostCapabilities\(\) as Record<string, unknown> \| undefined;\n'
              r'^[ \t]*recordDiag\(`app\.connect host capabilities \$\{JSON\.stringify\(\{\n'
              r'^[ \t]*serverTools: capabilities\?\.serverTools \?\? null,\n'
              r'^[ \t]*updateModelContext: capabilities\?\.updateModelContext \?\? null,\n'
              r'^[ \t]*message: capabilities\?\.message \?\? null,\n'
              r'^[ \t]*\}\)\}`\);',
              re.MULTILINE,
          )
          s, count = pattern.subn('        recordDiag("app.connect host capabilities received");', s)
          assert count == 1, count
          p.write_text(s)

          p = Path('tests/bridge-listener-apps-portability.test.ts')
          s = p.read_text()
          assert s.count('ui://leileios/message-bridge/v4') == 1
          s = s.replace('ui://leileios/message-bridge/v4', 'ui://leileios/message-bridge/v5')
          replacements = {
              'test("Bridge Diagnostics records the host capability shape after connect", async () => {':
                  'test("Bridge Diagnostics records capability readiness without serializing host data", async () => {',
              '    assert.match(diagnostics, /app\\.connect host capabilities .*"serverTools":\\{\\}/);':
                  '    assert.match(diagnostics, /app\\.connect host capabilities received/);',
              '    assert.match(diagnostics, /"updateModelContext":\\{"text":\\{\\}\\}/);':
                  '    assert.doesNotMatch(diagnostics, /"serverTools"|"updateModelContext"/);',
              '    assert.match(diagnostics, /"message":\\{"text":\\{\\}\\}/);':
                  '    assert.doesNotMatch(diagnostics, /"message"/);',
          }
          for old_line, new_line in replacements.items():
              assert s.count(old_line) == 1, old_line
              s = s.replace(old_line, new_line)
          p.write_text(s)
          PY
      - run: pnpm build
      - name: Commit source, generated bundle, and tests
        shell: bash
        run: |
          rm .github/workflows/bridge-v5-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mcp/tools/bridge-listener/listener-resource.ts \
                  src/mcp/tools/bridge-listener/browser-runtime.ts \
                  src/mcp/tools/bridge-listener/browser-runtime.js \
                  tests/bridge-listener-apps-portability.test.ts \
                  .github/workflows/bridge-v5-apply.yml
          git commit -m 'fix(bridge): refresh Message Bridge resource'
          git push origin HEAD:fix/message-bridge-resource-v5
