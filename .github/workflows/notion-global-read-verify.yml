name: Notion global read verification

on:
  push:
    branches:
      - feat/notion-global-read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx --test --test-concurrency=1 tests/notion-read-client.test.ts tests/notion-mcp-tools.test.ts tests/notion-server-wiring.test.ts
