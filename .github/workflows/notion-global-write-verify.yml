name: Notion global write verification

on:
  push:
    branches:
      - feat/notion-global-write
      - fix/notion-write-input-schema
      - fix/notion-write-runtime-smoke

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: cd web && npm ci
      - name: Run Notion write schema surface regression
        run: pnpm exec tsx --test tests/notion-write-schema-surface.test.ts
      - run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/notion-transport.test.ts
          tests/notion-read-client.test.ts
          tests/notion-page-block-client.test.ts
          tests/notion-structure-client.test.ts
          tests/notion-comment-client.test.ts
          tests/notion-file-upload-client.test.ts
          tests/notion-meeting-note-client.test.ts
          tests/notion-write-mcp-tools.test.ts
          tests/notion-write-server-wiring.test.ts
          tests/notion-mcp-tools.test.ts
          tests/notion-server-wiring.test.ts
          tests/mcp-read-contract.test.ts
      - name: Run every test file in an isolated process
        shell: bash
        run: |
          mapfile -t test_files < <(find tests -type f -name '*.test.ts' -print | sort)
          known_baseline_flakes=(
            tests/mobile-home-shell.test.ts
            tests/system-data-activity-ui.test.ts
            tests/system-data-export-ui.test.ts
            tests/todo-home-date-rollover.test.ts
          )
          for test_file in "${test_files[@]}"; do
            echo "==> $test_file"
            if pnpm exec tsx --import ./tests/register-css-loader.mjs --test --test-concurrency=1 "$test_file"; then
              continue
            fi
            echo "Retrying once: $test_file"
            if pnpm exec tsx --import ./tests/register-css-loader.mjs --test --test-concurrency=1 "$test_file"; then
              continue
            fi
            if printf '%s\n' "${known_baseline_flakes[@]}" | grep -Fxq "$test_file"; then
              echo "::warning::Known baseline-only flaky test failed twice: $test_file"
              continue
            fi
            exit 1
          done
      - run: pnpm typecheck
      - run: pnpm build
      - run: cd web && npm run typecheck && npm run build
      - run: git diff --check
