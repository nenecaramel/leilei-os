name: Notion global write verification

on:
  push:
    branches:
      - main
    paths:
      - src/domains/notion/**
      - src/mcp/server/register-notion-writes.ts
      - src/mcp/tools/**
      - tests/notion-*.test.ts
      - tests/notion-read-schema-surface.test.ts
      - tests/mcp-error-contract.test.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tests/register-css-loader.mjs
      - .github/workflows/notion-global-write-verify.yml
  pull_request:
    branches:
      - main
    paths:
      - src/domains/notion/**
      - src/mcp/server/register-notion-writes.ts
      - src/mcp/tools/**
      - tests/notion-*.test.ts
      - tests/notion-read-schema-surface.test.ts
      - tests/mcp-error-contract.test.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tests/register-css-loader.mjs
      - .github/workflows/notion-global-write-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact event head: $actual"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: cd web && npm ci
      - name: Run Notion write schema surface regression
        run: pnpm exec tsx --test tests/notion-write-schema-surface.test.ts
      - run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/notion-provider-deadline.test.ts
          tests/notion-transport.test.ts
          tests/notion-read-client.test.ts
          tests/notion-page-block-client.test.ts
          tests/notion-structure-client.test.ts
          tests/notion-comment-client.test.ts
          tests/notion-file-upload-client.test.ts
          tests/notion-meeting-note-client.test.ts
          tests/notion-write-mcp-tools.test.ts
          tests/notion-write-server-wiring.test.ts
          tests/notion-mcp-tools.test.ts
          tests/notion-server-wiring.test.ts
          tests/notion-read-schema-surface.test.ts
      - name: Run deterministic canonical test suite
        run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: cd web && npm run typecheck && npm run build
      - run: git diff --check
