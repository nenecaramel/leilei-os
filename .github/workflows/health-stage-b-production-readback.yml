name: Health Stage B production readback

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/health-stage-b-production-readback.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Require production readback secret
        env:
          DATABASE_URL: ${{ secrets.HEALTH_STAGE_B_PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DATABASE_URL}" ]] || { echo "Missing HEALTH_STAGE_B_PRODUCTION_DATABASE_URL" >&2; exit 1; }

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Verify production Health Stage B state
        env:
          DATABASE_URL: ${{ secrets.HEALTH_STAGE_B_PRODUCTION_DATABASE_URL }}
          PSQL_BIN: /usr/lib/postgresql/18/bin/psql
          PGCONNECT_TIMEOUT: "15"
        shell: bash
        run: |
          set -euo pipefail

          query() {
            "${PSQL_BIN}" "${DATABASE_URL}" -XAt -v ON_ERROR_STOP=1 -c "$1"
          }

          HEALTH_EXISTS="$(query "SELECT to_regclass('public.health_records') IS NOT NULL;")"
          LEDGER_COUNT="$(query "SELECT count(*) FROM public.leilei_schema_migrations;")"
          LATEST_CREATED_AT="$(query "SELECT created_at::text FROM public.leilei_schema_migrations ORDER BY created_at DESC LIMIT 1;")"
          LATEST_HASH="$(query "SELECT hash FROM public.leilei_schema_migrations ORDER BY created_at DESC LIMIT 1;")"
          DURABLE_COUNTS="$("${PSQL_BIN}" "${DATABASE_URL}" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM core_memories),(SELECT count(*) FROM diary_entries),(SELECT count(*) FROM tasks),(SELECT count(*) FROM user_settings);")"

          [[ "${HEALTH_EXISTS}" == "f" ]] || { echo "health_records still exists in production" >&2; exit 1; }
          [[ "${LEDGER_COUNT}" == "8" ]] || { echo "Production migration ledger count is not 8" >&2; exit 1; }
          [[ "${LATEST_CREATED_AT}" == "1787110593427" ]] || { echo "Production migration ledger is not at 0024_brainy_wildside" >&2; exit 1; }
          [[ -n "${LATEST_HASH}" ]] || { echo "Production migration ledger latest hash is empty" >&2; exit 1; }

          {
            echo "health_stage_b_production_readback=pass"
            echo "health_records_absent=true"
            echo "migration_ledger_count=${LEDGER_COUNT}"
            echo "migration_ledger_latest_created_at=${LATEST_CREATED_AT}"
            echo "migration_ledger_latest_hash=${LATEST_HASH}"
            echo "durable_counts=${DURABLE_COUNTS}"
          } | tee health-stage-b-production-readback.txt

      - name: Preserve production readback evidence
        uses: actions/upload-artifact@v4
        with:
          name: health-stage-b-production-readback-${{ github.sha }}
          path: health-stage-b-production-readback.txt
          if-no-files-found: error
          retention-days: 90
