name: MCP session lifecycle verification

on:
  pull_request:
    branches:
      - main
    paths:
      - src/app/index.ts
      - src/app/create-app.ts
      - src/app/process-runtime.ts
      - src/app/graceful-shutdown.ts
      - src/database/client.ts
      - src/mcp/server/create-server.ts
      - src/mcp/server/production-server-factory.ts
      - src/mcp/server/idempotency-retention.ts
      - src/mcp/server/session-registry.ts
      - src/mcp/server/router.ts
      - tests/database-resource-ownership.test.ts
      - tests/database-readiness-wiring.test.ts
      - tests/process-runtime.test.ts
      - tests/graceful-shutdown.test.ts
      - tests/mcp-idempotency-retention.test.ts
      - tests/mcp-production-resource-wiring.test.ts
      - tests/mcp-session-registry.test.ts
      - tests/mcp-session-preflight.test.ts
      - .github/workflows/mcp-session-lifecycle-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          echo "Checked out exact PR head: $actual"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd web && npm ci
      - name: Run focused MCP lifecycle tests
        run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/database-resource-ownership.test.ts
          tests/database-readiness-wiring.test.ts
          tests/process-runtime.test.ts
          tests/graceful-shutdown.test.ts
          tests/mcp-idempotency-retention.test.ts
          tests/mcp-production-resource-wiring.test.ts
          tests/mcp-session-registry.test.ts
          tests/mcp-session-preflight.test.ts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: cd web && npm run typecheck && npm run build
      - run: git diff --check
