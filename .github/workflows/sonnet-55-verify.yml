name: Sonnet 5.5 Verify

on:
  pull_request:
    paths:
      - "src/domains/bridge/native-live-execution-selection.ts"
      - "tools/claude-bridge/src/agent-sdk-execution-selection.mjs"
      - "tools/claude-bridge/test/agent-sdk-execution-selection.test.mjs"
      - "ios/LeileiOS/LeileiOS/Infrastructure/LeileiAPIClient.swift"
      - "tests/native-live-runtime-protocol.test.ts"
      - "tests/ios-sonnet-55-execution-selection.test.ts"
      - ".github/workflows/sonnet-55-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Backend execution-selection regression
        run: pnpm exec tsx --test --test-concurrency=1 tests/native-live-runtime-protocol.test.ts
      - name: Bridge execution-selection regression
        run: node --test tools/claude-bridge/test/agent-sdk-execution-selection.test.mjs
      - name: iOS model contract regression
        run: pnpm exec tsx --test --test-concurrency=1 tests/ios-sonnet-55-execution-selection.test.ts
      - run: pnpm build
      - run: git diff --check
